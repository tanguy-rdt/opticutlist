<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan and optimize rectangular panel cuts in your browser." />
    <title>OptiCutList</title>
    <script id="theme-init">
      try {
        const theme = localStorage.getItem('opticutlist.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch { /* CSS follows the system preference when storage is unavailable. */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
