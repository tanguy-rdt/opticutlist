name: Publish developer Wiki

on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/wiki/**'
      - '.github/workflows/publish-wiki.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# The separate Wiki credential is explicitly provided only to the publication step.
permissions:
  contents: read

concurrency:
  group: publish-wiki-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    # Dynamic default-branch guard also prevents manual publication from other branches.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Test the local publisher
        run: npm run test:unit -- scripts/wiki/__tests__

      - name: Validate documentation before accessing the Wiki
        env:
          WIKI_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/wiki/cli.ts --validate --source "$GITHUB_WORKSPACE" --repository "$WIKI_REPOSITORY" --branch "$SOURCE_BRANCH"

      - name: Clone Wiki
        env:
          WIKI_PUBLISH_TOKEN: ${{ secrets.WIKI_PUBLISH_TOKEN }}
          WIKI_REPOSITORY: ${{ github.repository }}
        run: bash scripts/wiki/git-auth.sh clone "$RUNNER_TEMP/opticutlist-wiki"

      - name: Generate, check ownership and commit changed content without credentials
        id: content
        env:
          WIKI_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          wiki_dir="$RUNNER_TEMP/opticutlist-wiki"
          node scripts/wiki/cli.ts --source "$GITHUB_WORKSPACE" --destination "$wiki_dir" --repository "$WIKI_REPOSITORY" --branch "$SOURCE_BRANCH"
          git -C "$wiki_dir" add --force --all
          if git -C "$wiki_dir" diff --cached --quiet; then
            echo 'Wiki content is unchanged; no commit or push.'
            exit 0
          fi
          git -C "$wiki_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m 'docs: synchronize developer documentation'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Push changed Wiki content
        if: steps.content.outputs.changed == 'true'
        env:
          WIKI_PUBLISH_TOKEN: ${{ secrets.WIKI_PUBLISH_TOKEN }}
        run: bash scripts/wiki/git-auth.sh push "$RUNNER_TEMP/opticutlist-wiki"
